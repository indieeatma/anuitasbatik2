function teamPg(){const ic=["heart","users","chart"];return hdr("Pilih Ruang Tim")+`<div class="strip"></div><div class="pg beige">${im("wf","imd l")}${im("gn","imd r")}<div class="wrap"><div class="hd">${ORN}<h1>Pilih Ruang Tim</h1><p>Sembilan tim. Tiga kisah. Satu misi.</p></div><div class="tg">${[1,2,3,4,5,6,7,8,9].map(n=>{const c=caseOf(n),k=n<=3?0:n<=6?1:2,dn=doneN(n);return `<button class="tm ${S.team===n?"on":""}" data-a="team" data-n="${n}"><div class="sb"></div><div class="ic">${IC(ic[k],30)}</div><h3>TIM ${String(n).padStart(2,"0")}</h3><em>KASUS ${"ABC"[k]}</em><p>${c.n}</p><span class="bdg">${S.team===n?"Sudah dipilih":dn?dn+" / 4 misi":""}</span></button>`}).join("")}</div></div></div>`}

function mission(){const c=C(),m=MS[S.m-1],o=c.opts[Math.min(S.o,c.opts.length-1)],fl={3:im("wb","imh l")+im("wp","imh r"),4:im("gn","imh l")+im("vl","imv")}[S.m]||"",head=`<div class="hd">${fl}${S.m>1?ORN:""}<span class="pill">MISSION 0${S.m}</span><h1>${m.t}</h1><p>${m.s}</p></div>`;let body="";
if(S.m===1){body=`<div class="g2 m1"><div class="card imp sk">${pimg("p11")}</div><div class="g1"><div class="card"><h3>Data kasus</h3><div class="bd"><p style="margin-top:0">${c.story} Penghasilan bersih pemilik Rp4.000.000 per bulan, dan cicilan sebaiknya tidak melebihi 35% dari penghasilan bersih.</p><div class="tiles">${tile("coin","Kebutuhan modal",fmt(c.need))}${tile("user","Penghasilan bersih",fmt(INC)+" / bulan")}${c.inv?tile("heart","Suntikan investor",fmt(c.inv)):""}${tile("chart","Batas aman cicilan","35% dari penghasilan")}</div><p class="note" style="margin:0">Angka bunga adalah asumsi simulasi pembelajaran, bukan penawaran resmi.</p></div></div>${task(m,c)}</div>`}
else if(S.m===2){const r=S.cr;body=`<div class="g2 m2"><div class="g1"><div class="card"><h3>Konsep singkat</h3><div class="bd"><b>Anuitas</b> adalah pembayaran berkala dengan jumlah yang sama selama periode tertentu.<div class="fm">A = <span class="fr"><u>M × i</u><s>1 − (1+i)<sup>−n</sup></s></span></div><ul class="lg"><li><i>A</i>besar anuitas</li><li><i>M</i>besar pinjaman (pokok pinjaman)</li><li><i>i</i>suku bunga per periode</li><li><i>n</i>jumlah periode</li></ul></div></div>

<div class="g1 sk">${task(m,c)}<div class="card imp il">${pimg("gm")}</div></div></div>`}
else if(S.m===3){const x=calc(o),ok=dx()[2]===true;body=`<div class="g1"><div class="card"><h3>Susun tabel di spreadsheet</h3><div class="bd"><p style="margin-top:0">Setiap pembayaran anuitas terdiri dari <b>bunga</b> dan <b>angsuran pokok</b>. Buka spreadsheet kelas, pilih sheet tim kalian (<b>TIM ${String(S.team).padStart(2,"0")}</b>), lalu isi tabel berikut.</p><div class="tiles">${tile("coin","Pokok pinjaman",fmt(o.M))}${tile("chart","Bunga",pct(o.i)+" per bulan")}${tile("cal","Tenor",o.n+" bulan")}${tile("sheet","Anuitas (hasil Mission 02)",ok?fmt(x.A):"selesaikan Mission 02")}</div><div class="tw"><table><tr><th>Periode</th><th>Saldo Awal</th><th>Anuitas</th><th>Bunga</th><th>Angsuran Pokok</th><th>Sisa Pinjaman</th></tr><tr><td>1</td><td>pokok pinjaman</td><td>A</td><td>Saldo Awal × i</td><td>Anuitas – Bunga</td><td>Saldo Awal – Angsuran Pokok</td></tr><tr><td>2</td><td>Sisa Pinjaman periode 1</td><td>A</td><td>Saldo Awal × i</td><td>Anuitas – Bunga</td><td>Saldo Awal – Angsuran Pokok</td></tr><tr><td>…</td><td colspan="5">Lanjutkan sampai periode terakhir. Sisa pinjaman akhir mendekati nol karena pembulatan.</td></tr></table></div><div class="btns"><button class="bn" data-a="sheet">${IC("sheet",18)} Buka spreadsheet ${IC("ext",16)}</button><button class="bg" data-a="hint">${IC("bulb",18)} Petunjuk</button></div></div></div>${task(m,c)}</div>`}
else{body=`<div class="g1"><div class="card"><h3>Data keputusan</h3><div class="bd"><div class="tiles">${tile("user","Penghasilan bersih",fmt(INC)+" / bulan")}${tile("check","Batas aman cicilan (35%)",fmt(LIM))}</div>${optTiles(o,tile("sheet","Anuitas (hasil Mission 02)",fmt(calc(o).A)))}</div></div>${task(m,c)}</div>`}
return hdr(`Mission 0${S.m} · ${m.t}`)+`<div class="pg"><div class="wrap">${head}${body}</div></div>`}
function sum(){const c=C();return hdr("Rangkuman Misi")+`<div class="pg"><div class="wrap"><div class="hd">${ORN}<span class="pill">TIM ${String(S.team).padStart(2,"0")} · KASUS ${"ABC"[S.team<=3?0:S.team<=6?1:2]}</span><h1>Misi Selesai</h1><p>${c.n}: ${c.s}</p></div><div class="g1"><div class="card imp wide">${pimg("p9")}</div><div class="card"><h3>Hasil keputusan</h3><div class="bd"><div class="tw"><table><tr><th>Penawaran</th><th>Anuitas</th><th>Total pembayaran</th><th>Total biaya</th><th>Keputusan</th></tr>${c.opts.map(o=>{const x=calc(o);return `<tr><td>${o.l}</td><td>${fmt(x.A)}</td><td>${fmt(x.tb)}</td><td>${fmt(x.tc)}</td><td><b>${x.A<=LIM+.5?"Deal":"Drain"}</b></td></tr>`}).join("")}</table></div><p class="note">Batas aman cicilan ${fmt(LIM)}. Total biaya adalah hasil model simulasi, tanpa biaya administrasi.</p></div></div><div class="card"><h3>Jawaban kelompok</h3><div class="bd">${TX.map(([k,l])=>`<p style="margin-top:0"><b>${l}</b><br>${esc(A_()["t_"+k])||"<i>belum diisi</i>"}</p>`).join("")}<div class="btns"><button class="bg" data-a="go" data-p="m" data-n="4">Ubah jawaban</button><button class="bn" data-a="go" data-p="team">Kembali ke ruang tim</button></div></div></div></div></div></div>`}

<div class="nx"><span>${IC("fwd",15)} Langkah berikutnya: <b style="color:var(--navy)">${nx<4?`Mission 0${nx+1}, ${MS[nx].t}`:"Ruang Refleksi"}</b></span><button class="bg" data-a="dm" data-i="${nx}">Lanjutkan</button></div>
<div class="dg">${DC.map((x,i)=>{const s=st(i);return `<button class="dc ${i>2?"w ":""}${s}" data-a="dm" data-i="${i}" ${s==="lock"?"disabled":""}><div class="sb"></div><span class="no">0${i+1}</span><div class="ic">${IC(s==="done"?"check":s==="lock"?"lock":x[2],18)}</div><h3>${x[0]}</h3><p>${x[1]}</p><span class="bdg">${{done:"SELESAI",open:"TERBUKA",lock:"TERKUNCI"}[s]}</span></button>`}).join("")}</div></div></div>`}
function render(){const p=S.page,T=S.team;document.body.classList.toggle("island",p==="land");$("#app").innerHTML=p==="land"?land():p==="team"||!T?teamPg():p==="brief"?brief():p==="dash"?dash():p==="sum"?sum():mission();document.querySelectorAll(".tw table").forEach(t=>{const hs=[...t.rows[0].cells].map(c=>c.textContent.trim());[...t.rows].slice(1).forEach(r=>{let i=0;[...r.cells].forEach(c=>{c.dataset.l=hs[i]||"";i+=c.colSpan||1})})});
save();if(!render.keep)scrollTo(0,0);render.keep=0}
// ===== AKSI =====
let ac;function ctx(){try{const C=window.AudioContext||window.webkitAudioContext;ac=ac||new C();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(f,t0,d,type,v){const c=ctx();if(!c||S.au.cv<.01)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,v*S.au.cv),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)}
function beep(ok){if(S.au.cm)return;if(ok){[[784,0],[988,.11],[1319,.22]].forEach(([f,t])=>tone(f,t,.35,"triangle",.28))}else{tone(220,0,.22,"sawtooth",.16);tone(165,.17,.35,"sawtooth",.16)}}
function tick(){if(!S.au.cm)tone(520,0,.07,"sine",.12)}
document.addEventListener("pointerdown",ctx,{once:true});
function toast(t){const d=document.createElement("div");d.className="tst";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function modal(h,own){const d=document.createElement("div");d.className="mod";d.id="md";d.setAttribute("role","dialog");d.innerHTML=`<div>${h}${own?"":'<div class="btns"><button class="bn" data-a="close">Tutup</button></div>'}</div>`;document.body.appendChild(d)}
function check(){const c=C(),m=MS[S.m-1],R=R_(),A=A_();let all=true;const ops=m.g?[0]:c.opts.map((_,i)=>i);
ops.forEach(oi=>{const x=m.g?null:calc(c.opts[oi]);m.f.forEach(([k,l,fn,ty])=>{const key=`${S.m}_${oi}_${k}`,e=fn(x,c),v=A[key];const ok=ty?v===e:(v!==undefined&&v!==""&&Math.abs(num(v)-e)<=((S.m===2&&k==="A")?Math.max(500,e*.001):500));R[key]=ok?"ok":"no";if(!ok)all=false})});
if(S.m===4)TX.forEach(([k])=>{const ok=(A["t_"+k]||"").trim().length>=10;R["t_"+k]=ok?"ok":"no";if(!ok)all=false});
dx()[S.m]=all;R["fb"+S.m]=all?{ok:1,t:["Benar. Kalian telah menemukan kebutuhan pembiayaan.","Anuitas sudah tepat.","Hasil analisis sudah tepat. Pola angsuran pokok dan bunga sudah kalian temukan.","Keputusan dan perhitungan sudah tepat. Misi selesai!"][S.m-1]}:{ok:0,t:S.m===4?"Masih ada isian yang belum tepat atau belum lengkap. Periksa kolom bertanda merah (jawaban tertulis minimal 10 karakter).":"Masih ada jawaban yang belum tepat. Periksa kolom bertanda merah dan gunakan petunjuk."};
beep(all);render.keep=1;render()}
function hit(){const o=C().opts[Math.min(S.o,C().opts.length-1)],g=id=>($("#"+id).value||"").trim(),rm=g("cm"),ri=g("ci").replace(",","."),rn=g("cn");let e="";
const M=rm?num(rm):o.M,I=ri===""?o.i:ri,N=rn===""?o.n:rn;
if(rm&&!/^[\d.,]+$/.test(rm))e="M hanya boleh berisi angka.";else if(!/^\d*\.?\d+$/.test(String(I)))e="i harus berupa angka, misalnya 1 atau 0,5.";else if(!/^\d+$/.test(String(N))||+N<=0)e="n harus bilangan bulat positif, misalnya 12 atau 24.";else if(!(M>0))e="M harus lebih dari 0.";
if(e)S.cr={e};else{const i=+I/100,a=M*i,b=Math.pow(1+i,-N),c=1-b;S.cr=[a,b,c].every(isFinite)?{a,b,c,z:i===0}:{e:"Nilai terlalu besar untuk dihitung."}}
const keep=["cm","ci","cn"].map(id=>$("#"+id).value);render.keep=1;render();["cm","ci","cn"].forEach((id,k)=>$("#"+id).value=keep[k]);const hh=$("#cmh");if(hh)hh.textContent=hint(keep[0])}
function goMission(n){S.page="m";S.m=n;S.o=0;S.cr=null;render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;if(a!=="chk"&&a!=="mute"&&!t.disabled)tick();
if(a==="go"){if(t.dataset.p==="m")goMission(+t.dataset.n);else{S.page=t.dataset.p;render()}}
else if(a==="back"){S.page={team:"land",brief:"team",dash:"brief",sum:"dash",m:"dash"}[S.page]||"land";render()}
else if(a==="dm"){if(t.disabled)return;const i=+t.dataset.i;if(i<4)goMission(i+1);else{S.page="sum";render()}}
else if(a==="team"){S.team=+t.dataset.n;S.page="brief";render()}
else if(a==="opt"){S.o=+t.dataset.i;render.keep=1;render()}
else if(a==="chk")check();else if(a==="hit")hit();
else if(a==="nxt")goMission(S.m+1);
else if(a==="hint")modal(`<h3>Petunjuk</h3><p>${MS[S.m-1].hint}</p>`);
else if(a==="sheet"){if(SHEET_URL)window.open(SHEET_URL,"_blank","noopener");else toast("Spreadsheet belum diatur oleh pengajar (SHEET_URL).")}
else if(a==="mute"){const m=!(S.au.mm&&S.au.cm);S.au.mm=S.au.cm=m;applyAu();render.keep=1;render()}
else if(a==="playm"){startMusic();setTimeout(refreshAus,600)}
else if(a==="aum"){const k=t.dataset.k;S.au[k]=!S.au[k];applyAu();$("#aus").innerHTML=auInner();save()}
else if(a==="close")$("#md")?.remove();
else if(a==="modal")modal(setHtml(),1);
else if(a==="reset"){if(t.dataset.ok){try{localStorage.removeItem(KEY)}catch(x){}S={page:"land",team:null,m:1,o:0,a:{},r:{},d:{},au:S.au,cr:null};$("#md")?.remove();render()}else{t.dataset.ok=1;t.textContent="Tekan lagi untuk menghapus"}}});
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(f){A_()[f]=t.value;delete R_()[f];save();const hh=t.closest("label")?.querySelector(".mh");if(hh&&t.dataset.m)hh.textContent=hint(t.value)}
if(t.id==="cm"){const hh=$("#cmh");if(hh)hh.textContent=hint(t.value)}
if(t.dataset.au){const k=t.dataset.au,mk=t.dataset.mk;S.au[k]=t.value/100;if(S.au[mk]&&t.value>0){S.au[mk]=false;const b=t.closest(".au-row").querySelector(".au-m");b.textContent="Mute";b.classList.remove("on");b.setAttribute("aria-pressed","false")}t.nextElementSibling.textContent=t.value+"%";applyAu();save()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.au==="cv")tick();if(t.dataset.m){const n=num(t.value);t.value=/\d/.test(t.value)?n.toLocaleString("id-ID",{maximumFractionDigits:2}):"";A_()[t.dataset.f]=t.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#md")?.remove()});
document.addEventListener("mousemove",e=>{const s=$(".hm");if(!s)return;s.style.setProperty("--px",(e.clientX/innerWidth-.5).toFixed(3));s.style.setProperty("--py",(e.clientY/innerHeight-.5).toFixed(3))});

const bgm=new Audio("assets/audio/gamelan.mp3");bgm.loop=true;bgm.preload="auto";bgm.setAttribute("playsinline","");
let bgGain=null;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function routeBgm(){if(bgGain||!IOS||!/^https?:/.test(location.protocol))return;const c=ctx();if(!c)return;try{const s=c.createMediaElementSource(bgm);bgGain=c.createGain();s.connect(bgGain);bgGain.connect(c.destination);bgm.volume=1}catch(e){bgGain=null}}
function applyAu(){const v=S.au.mm?0:Math.min(1,Math.max(0,S.au.mv));if(bgGain)bgGain.gain.value=v;else bgm.volume=v}
function startMusic(){routeBgm();applyAu();const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}
const GE=["click","pointerup","touchend","keydown"],gs=()=>{ctx();if(bgm.paused)startMusic()};
GE.forEach(ev=>addEventListener(ev,gs,true));
bgm.addEventListener("playing",()=>GE.forEach(ev=>removeEventListener(ev,gs,true)));
document.addEventListener("visibilitychange",()=>{if(document.hidden)bgm.pause();else if(bgm.paused&&bgm.currentTime>0)startMusic()});
applyAu();startMusic();
["playing","pause","error"].forEach(ev=>bgm.addEventListener(ev,refreshAus));
render();
</script></body></html>
